<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#c99a5e"/><stop offset="46%" stop-color="#8a5f2e"/><stop offset="100%" stop-color="#2e1c0b"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="coin" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0%" stop-color="#ffe08a"/><stop offset="52%" stop-color="#e0a83a"/><stop offset="100%" stop-color="#9d6b12"/></linearGradient>
<linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#7fb9c4"/><stop offset="100%" stop-color="#2f7d8c"/></linearGradient>
<linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f2a259"/><stop offset="100%" stop-color="#c26a1c"/></linearGradient>
<linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
<stop offset="0%" stop-color="#ffd775"/><stop offset="100%" stop-color="#e0a83a"/></linearGradient>
<linearGradient id="pct" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0%" stop-color="#4fc07d"/><stop offset="55%" stop-color="#2f9d5b"/><stop offset="100%" stop-color="#15613a"/></linearGradient>
</defs>

<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="906" rx="340" ry="28" fill="#170e04" opacity=".55"/>

<!-- bars -->
<g>
  <rect x="150" y="606" width="126" height="262" rx="18" fill="url(#bar1)"/>
  <rect x="150" y="606" width="126" height="14" rx="7" fill="#a9d3da"/>
  <rect x="318" y="512" width="126" height="356" rx="18" fill="url(#bar1)"/>
  <rect x="318" y="512" width="126" height="14" rx="7" fill="#a9d3da"/>
  <rect x="486" y="430" width="126" height="438" rx="18" fill="url(#bar1)"/>
  <rect x="486" y="430" width="126" height="14" rx="7" fill="#a9d3da"/>
  <rect x="654" y="336" width="126" height="532" rx="18" fill="url(#bar2)"/>
  <rect x="654" y="336" width="126" height="14" rx="7" fill="#ffc98d"/>
</g>
<rect x="120" y="862" width="700" height="20" rx="10" fill="#4a3venue"/>
<rect x="120" y="862" width="700" height="20" rx="10" fill="#523a1e"/>

<!-- rising arrow -->
<g>
  <path d="M156 604 L360 470 L520 542 L742 300" fill="none" stroke="#4a2f10" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
  <path d="M150 596 L354 462 L514 534 L736 292" fill="none" stroke="url(#arrow)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642 258 L790 246 L768 392 Z" fill="#4a2f10" opacity=".45" transform="translate(6 8)"/>
  <path d="M642 258 L790 246 L768 392 Z" fill="url(#arrow)"/>
</g>

<!-- coin -->
<g transform="translate(252 226)">
  <circle cx="6" cy="10" r="128" fill="#3d2508" opacity=".45"/>
  <circle cx="0" cy="0" r="128" fill="url(#coin)"/>
  <circle cx="0" cy="0" r="128" fill="none" stroke="#8a5c0f" stroke-width="12"/>
  <circle cx="0" cy="0" r="98" fill="none" stroke="#fff3cf" stroke-width="9" opacity=".55"/>
  <rect x="-11" y="-86" width="22" height="172" rx="11" fill="#5c3c06"/>
  <path d="M36 -44 C36 -66 -36 -66 -36 -30 C-36 -2 36 2 36 32 C36 66 -36 66 -36 42"
        fill="none" stroke="#5c3c06" stroke-width="26" stroke-linecap="round"/>
</g>

<!-- win-rate badge -->
<g transform="translate(760 736)">
  <circle cx="8" cy="12" r="150" fill="#170e04" opacity=".45"/>
  <circle cx="0" cy="0" r="150" fill="url(#pct)"/>
  <circle cx="0" cy="0" r="150" fill="none" stroke="#12492c" stroke-width="12"/>
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <circle cx="-46" cy="-44" r="30" stroke-width="22"/>
    <circle cx="48" cy="46" r="30" stroke-width="22"/>
    <path d="M-62 62 L64 -62" stroke-width="24"/>
  </g>
</g>
</svg>
